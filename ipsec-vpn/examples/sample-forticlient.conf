<?xml version="1.0" encoding="UTF-8" ?>
<!-- Sanitised example of a FortiClient IPsec (IKEv2, PSK + username/password) export.
     Server and names are fictional; the pre-shared key and username are not stored here (real exports
     contain them encrypted as "EncX ..." values that this app cannot, and does not try to, decrypt). -->
<forticlient_configuration>
    <forticlient_version>7.4.5.1949</forticlient_version>
    <vpn>
        <ipsecvpn>
            <connections>
                <connection>
                    <name>Example IPsec</name>
                    <type>manual</type>
                    <ike_settings>
                        <version>2</version>
                        <server>vpn.example.com</server>
                        <authentication_method>Preshared Key</authentication_method>
                        <auth_data>
                            <preshared_key>EncX 0000000000000000000000000000000000000000</preshared_key>
                        </auth_data>
                        <dhgroup>21;</dhgroup>
                        <key_life>86400</key_life>
                        <tcp_port>5500</tcp_port>
                        <mode_config>1</mode_config>
                        <dpd>1</dpd>
                        <dpd_retry_count>3</dpd_retry_count>
                        <dpd_retry_interval>5</dpd_retry_interval>
                        <enable_ike_fragmentation>0</enable_ike_fragmentation>
                        <xauth>
                            <enabled>1</enabled>
                            <prompt_username>1</prompt_username>
                            <username>EncX 0000000000000000000000000000000000000000</username>
                        </xauth>
                        <proposals>
                            <proposal>AES128|SHA256</proposal>
                            <proposal>AES256|SHA256</proposal>
                        </proposals>
                    </ike_settings>
                    <ipsec_settings>
                        <remote_networks>
                            <network>
                                <addr>0.0.0.0</addr>
                                <mask>0.0.0.0</mask>
                            </network>
                        </remote_networks>
                        <dhgroup>21</dhgroup>
                        <key_life_type>seconds</key_life_type>
                        <key_life_seconds>43200</key_life_seconds>
                        <pfs>1</pfs>
                        <use_vip>1</use_vip>
                        <proposals>
                            <proposal>AES128|SHA256</proposal>
                            <proposal>AES256|SHA256</proposal>
                        </proposals>
                    </ipsec_settings>
                </connection>
            </connections>
        </ipsecvpn>
    </vpn>
</forticlient_configuration>
